<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Puritan's Pride Pull-Out Roster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-css">
/* Layout: quiet planner. Header + one toolbar, then three session columns (one column on phone). Agents live in a modal. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5; --line:#e2e6ec; --line-strong:#cfd5de;
  --fg:#18212c; --muted:#677385; --faint:#98a2b1; --accent:#24507d; --accent-soft:#e4ecf5;
  --ok:#22804f; --warn:#a85d00; --warn-soft:#fcf0de; --bad:#b52a3e; --bad-soft:#fbe7ea;
  --head:#e1f3e7; --head-line:#bfe3cb;
  --body:"Archivo",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#181f28; --surface-2:#212a35; --line:#29323e; --line-strong:#36414f;
  --fg:#e7ecf2; --muted:#98a4b5; --faint:#6c7889; --accent:#8bb8e6; --accent-soft:#1d3147;
  --ok:#62cf95; --warn:#f0ab52; --warn-soft:#3a2b14; --bad:#f2808f; --bad-soft:#3e1d23; --head:#1d3527; --head-line:#2b4a37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#181f28; --surface-2:#212a35; --line:#29323e; --line-strong:#36414f;
  --fg:#e7ecf2; --muted:#98a4b5; --faint:#6c7889; --accent:#8bb8e6; --accent-soft:#1d3147;
  --ok:#62cf95; --warn:#f0ab52; --warn-soft:#3a2b14; --bad:#f2808f; --bad-soft:#3e1d23; --head:#1d3527; --head-line:#2b4a37; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
h1{font-size:1.45rem;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.badge{font-size:.72rem;font-weight:600;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:1px 7px}
.badge:empty{display:none}

.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);line-height:1.2;text-align:left}
.seg button small{display:block;font-weight:400;font-size:.74rem}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.limits{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 8px 6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:.86rem}
.limits-l{display:grid;line-height:1.15;font-weight:600;color:var(--fg);padding-right:12px;border-right:1px solid var(--line)}
.limits-l small{font-weight:400;font-size:.72rem;color:var(--faint)}
.stepper{display:inline-flex;align-items:center;gap:8px}
.st-l{color:var(--muted);font-weight:500}
.st-c{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:8px;padding:2px}
.stepper button{width:26px;height:26px;border:0;background:transparent;border-radius:6px;cursor:pointer;font-weight:600;font-size:1rem;line-height:1;color:var(--muted)}
.stepper button:hover{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper output.mixed{font-family:var(--body);font-size:.75rem;color:var(--muted);padding:0 4px}
.stepper output{font-family:var(--mono);font-weight:600;color:var(--fg);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:520px){.limits{width:100%}.limits-l{flex-basis:100%;border-right:0;padding-right:0}}

.status{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.86rem;color:var(--muted)}
.status .ok{color:var(--ok);font-weight:600}
.status .bad{color:var(--bad);font-weight:600}
.miss{flex-basis:100%;padding:8px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
details.miss summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.miss summary::-webkit-details-marker{display:none}
details.miss .caret{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.miss[open] .caret{transform:rotate(45deg)}
details.miss .miss-body{margin-top:6px}
.warn-dialog{width:min(420px,100%)}
.warn-body{padding:0 16px 8px;display:grid;gap:8px;font-size:.9rem;color:var(--muted)}
.warn-body p{margin:0}
.warn-body strong{color:var(--fg)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.miss.ok{background:var(--head);color:var(--ok);font-weight:600}
.link.inline{color:var(--bad);text-decoration:underline;padding:0;margin-left:4px}
.status label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.card-h{background:var(--head);color:var(--fg);border-radius:11px 11px 0 0;border-bottom-color:var(--head-line)}
.card-h .ph,.card-h .mini-l{color:inherit;opacity:.75}
.card-h .mini button{border-color:var(--head-line);color:var(--fg)}
.t-row{display:flex;align-items:center;gap:6px}
.t-edit{position:relative;display:inline-flex}
.t-edit{align-items:center;gap:6px;border:1px dashed transparent;border-radius:7px;padding:1px 6px;margin-left:-7px;cursor:pointer}
.t-edit:hover,.t-edit:focus-within{border-color:var(--head-line);background:var(--surface)}
.t-edit:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.caret-d{width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.t-sel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cam{width:28px;height:28px;border:1px solid var(--head-line);background:var(--surface);color:var(--fg);border-radius:7px;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.cam:hover{border-color:var(--accent);color:var(--accent)}
.snap-modal .dialog{width:min(520px,100%)}
.snap-body{padding:0 16px 16px;display:grid;gap:10px;overflow:auto}
.snap-body img{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.snap-body p{margin:0;font-size:.84rem;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.mini-s{display:inline-flex;align-items:center;gap:5px;font-size:.78rem}
.mini-l{color:var(--muted);font-weight:600;min-width:3ch;text-align:right}
.mini button{width:22px;height:22px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:600;line-height:1;padding:0;font-size:.85rem}
.mini button:hover{border-color:var(--accent)}
.mini output{font-family:var(--mono);font-weight:600;min-width:1.6ch;text-align:center;font-variant-numeric:tabular-nums}
.card-h .t{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.card-h .ph{color:var(--muted);font-size:.8rem;font-family:var(--mono)}
.grp{padding:10px 8px 6px}
.grp+.grp{border-top:1px solid var(--line)}
.grp-l{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 8px 4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.row:hover{background:var(--surface-2)}
.row .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .note{display:inline-block;font-size:.72rem;font-weight:600;margin-left:6px;color:var(--accent)}
.row .note.warn{color:var(--warn)}
.row .meta{grid-column:1/-1;font-size:.74rem;color:var(--muted);font-family:var(--mono);margin-top:-2px}
.row .meta .w{color:var(--warn);font-family:var(--body)}
.row .meta{display:grid;gap:1px;margin-top:0;padding-bottom:2px}
.row .meta .k{font-family:var(--body);color:var(--faint);display:inline-block;min-width:8ch}
.x{width:28px;height:28px;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--faint);font-size:1.05rem;line-height:1}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.row.open{border:1px dashed var(--bad);background:var(--bad-soft);color:var(--bad);font-size:.86rem;font-weight:600}
.removed{padding:8px 16px 12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.removed button{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-weight:600}
.removed{background:var(--bad-soft);color:var(--bad);border-radius:0 0 11px 11px}
.removed s{color:var(--bad);font-weight:600}
.removed button{color:var(--bad);text-decoration:underline}
.hint{font-size:.82rem;color:var(--faint);margin:0}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:rgba(10,15,22,.45)}
.dialog{position:relative;width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
.dialog-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 12px}
.dialog-h h2{font-size:1.05rem;margin:0}
.dialog-h p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.dialog .seg{margin:0 16px 8px;display:flex}
.dialog .seg button{flex:1;text-align:center}
.list{list-style:none;margin:0;padding:4px 8px;overflow-y:auto;flex:1;min-height:0}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px;border-radius:8px}
.list li+li{border-top:1px solid var(--line)}
.list .nm{font-weight:500;overflow-wrap:anywhere}
.list .sh{display:block;font-size:.74rem;color:var(--muted);font-family:var(--mono)}
.list li.off .nm{color:var(--faint);text-decoration:line-through}
.list .rd{font-size:.78rem;color:var(--faint)}
.sw{appearance:none;width:38px;height:22px;border-radius:22px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--ok)}
.sw:checked::after{left:19px}
.dialog-f{display:flex;gap:8px;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.link{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--muted);font-size:.84rem;font-weight:600}
.link:hover{color:var(--accent)}
.sync{align-self:center;font-size:.8rem;color:var(--muted);padding-right:4px}
.sync.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.sync.busy{color:var(--warn)}
.sync.err{color:var(--bad)}
.pending .x,.pending .mini button,.pending .stepper button,.pending #fitInline,.pending .dialog-f,.pending .removed button{visibility:hidden}
.pending .sw{pointer-events:none;opacity:.55}
.sync .reset{border:0;background:none;padding:0;margin-left:6px;cursor:pointer;color:var(--accent);font-weight:600;font-size:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<template id="app-tpl"><div class="wrap">
  <header class="top">
    <div>
      <h1>Pull-Out Roster</h1>
      <p class="sub">Oct 27–29 · Puritan's Pride and GOL</p>
    </div>
    <div class="actions">
      <span class="sync" id="syncStatus" aria-live="polite"></span>
      <button class="btn" id="openAgents">Agents <span class="badge" id="agentsCount"></span></button>
      <button class="btn primary" id="copyBtn">Copy schedule</button>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="tablist" aria-label="Day" id="tabs"></div>
    <div class="limits" role="group" aria-label="Pull-outs per session">
      <span class="limits-l">Per session<small>all days</small></span>
      <span class="stepper"><span class="st-l">Puritan's Pride</span><span class="st-c"><button data-cap="pp" data-dir="-1" aria-label="Fewer Puritan's Pride pull-outs">−</button><output id="cap-pp"></output><button data-cap="pp" data-dir="1" aria-label="More Puritan's Pride pull-outs">+</button></span></span>
      <span class="stepper"><span class="st-l">GOL</span><span class="st-c"><button data-cap="iv" data-dir="-1" aria-label="Fewer GOL pull-outs">−</button><output id="cap-iv"></output><button data-cap="iv" data-dir="1" aria-label="More GOL pull-outs">+</button></span></span>
    </div>
  </div>

  <div class="status" aria-live="polite"><span id="status"></span><label><input type="checkbox" id="showDetails"> Show breaks</label></div>

  <div class="grid" id="sessionList"></div>

  <p class="hint">Click × to remove someone from a session; they're added to the next session that day where they're free. Switch an agent off in Agents to remove them for the whole day. Open spots are filled with a free agent from the same department.</p>
</div>

<div class="modal" id="agentsModal" hidden>
  <div class="scrim" data-close></div>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="rosterH">
    <div class="dialog-h"><div><h2 id="rosterH">Agents</h2><p id="rosterDay"></p></div><button class="btn" id="closeAgents" data-close>Done</button></div>
    <div class="seg" role="tablist" aria-label="Department" id="deptTabs"></div>
    <ul class="list" id="roster"></ul>
    <div class="dialog-f"><button class="link" id="resetDay">Reset this day</button><button class="link" id="resetAll">Reset all days</button></div>
  </section>
</div>
<div class="modal snap-modal" id="snapModal" hidden>
  <div class="scrim" data-snap-close></div>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="snapH">
    <div class="dialog-h"><div><h2 id="snapH">Session picture</h2><p id="snapMsg"></p></div><button class="btn" data-snap-close>Done</button></div>
    <div class="snap-body"><img id="snapImg" alt="Picture of the session's pull-out names"><p>If it didn't copy automatically, right-click the picture and choose Copy image (on a phone, press and hold it).</p></div>
  </section>
</div>
<div class="modal" id="fitModal" hidden>
  <div class="scrim" data-fit-close></div>
  <section class="dialog warn-dialog" role="alertdialog" aria-modal="true" aria-labelledby="fitH" aria-describedby="fitD">
    <div class="dialog-h"><div><h2 id="fitH">Replace every session's numbers?</h2></div></div>
    <div class="warn-body" id="fitD">
      <p>Fit everyone changes the number of Puritan's Pride and GOL spots in <strong>every session on all three days</strong>, so each agent gets one pull-out per day they can attend.</p>
      <p>Any numbers you set yourself will be replaced, and the lineup will be rebuilt. Agents you switched off or removed stay out.</p>
    </div>
    <div class="dialog-f"><button class="btn" data-fit-close>Cancel</button><button class="btn danger" id="fitYes">Yes, fit everyone</button></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div></template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="application/json" id="shared-state">null</script>
<script id="app-js">
(function(){const t=document.getElementById("app-tpl");t.parentNode.insertBefore(t.content.cloneNode(true),t);})();

const SESSIONS = [
  {et:"1:00–2:00 PM",ph:"1:00–2:00 AM",phStart:"1:00 AM",ivl:9},
  {et:"3:00–4:00 PM",ph:"3:00–4:00 AM",phStart:"3:00 AM",ivl:13},
  {et:"4:00–5:00 PM",ph:"4:00–5:00 AM",phStart:"4:00 AM",ivl:15}];
// Oct 27 sessions were moved to 2–3, 3–4 and 4–5 PM ET (Paul, Oct 27)
const SESSIONS_BY_DAY = {tue:[
  {et:"2:00–3:00 PM",ph:"2:00–3:00 AM",phStart:"2:00 AM",ivl:11},
  {et:"3:00–4:00 PM",ph:"3:00–4:00 AM",phStart:"3:00 AM",ivl:13},
  {et:"4:00–5:00 PM",ph:"4:00–5:00 AM",phStart:"4:00 AM",ivl:15}]};
// The Oct 27 groups move as a block: old 3–4 group → 2–3, old 4–5 group → 3–4, old 1–2 group → 4–5
const GROUP_MOVE = {tue:[1,2,0]};
var LEGACY=false; // true while working out the original (pre-move) Oct 27 lineup
// Session times can be edited on the page: st.all.times[day][session] = start time in ET minutes after midnight
const fmt12=m=>{m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return {t:`${h}:${String(mm).padStart(2,"0")}`,ap};};
const range12=m=>{const a=fmt12(m),b=fmt12(m+60);return a.ap===b.ap?`${a.t}–${b.t} ${b.ap}`:`${a.t} ${a.ap}–${b.t} ${b.ap}`;};
function sessFromStart(m){const ph=m+720,p=fmt12(ph);return {et:range12(m),ph:range12(ph),phStart:`${p.t} ${p.ap}`,ivl:(m-510)/30,start:m};}
const TIME_OPTIONS=[];for(let m=510;m<=1020;m+=30)TIME_OPTIONS.push(m); // 8:30 AM to 5:00 PM ET starts
const startOf=o=>{const m=o.et.match(/^(\d+):(\d+)/);let h=+m[1];const pm=/PM$/.test(o.et)&&!/AM–/.test(o.et);if(pm&&h<12)h+=12;return h*60+(+m[2]);};
const sess=(d,si)=>{if(!LEGACY&&typeof st!=="undefined"&&st.all&&st.all.times&&st.all.times[d]&&st.all.times[d][si]!=null)return sessFromStart(st.all.times[d][si]);
  return (!LEGACY&&SESSIONS_BY_DAY[d]?SESSIONS_BY_DAY[d]:SESSIONS)[si];};
const DAYS = {tue:{label:"Tuesday",date:"Oct 27"},wed:{label:"Wednesday",date:"Oct 28"},thu:{label:"Thursday",date:"Oct 29"}};

/* ---------- Puritan's Pride: shift + break times in PH time ---------- */
const PP_SCHED = {
  tue:{
    "Rezille Niez":["11PM-8AM","1:15 AM","4:00 AM","6:00 AM"],
    "Genesis John Elizon":["11PM-8AM","1:00 AM","4:30 AM","6:15 AM"],
    "Janin Joyce Panilo":["10PM-7AM","12:30 AM","2:45 AM","5:30 AM"],
    "Louise Gale Cotaco":["10PM-7AM","12:15 AM","3:00 AM","5:45 AM"],
    "Nathalia Advincula":["10PM-7AM","12:15 AM","2:30 AM","5:45 AM"],
    "Triciane Mae Garro":["9PM-6AM","10:30 PM","1:30 AM","4:45 AM"],
    "Merry Joy Balaguer":["9PM-6AM","11:00 PM","2:30 AM","4:45 AM"],
    "Alliah Krychelle Ramos":["8PM-5AM","9:45 PM","1:00 AM","3:30 AM"],
    "ErikaMae Viloria":["8PM-5AM","9:45 PM","1:00 AM","3:30 AM"],

// Balanced default lineup across all three days: every agent who can attend gets in, and counts differ by at most one where schedules allow
const LINEUP_MEMO={};
function buildLineup(g){
  const key=(LEGACY?"legacy:":JSON.stringify(st.all.times||{}))+g+":"+JSON.stringify(["tue","wed","thu"].map(d=>capS[d].map(c=>c[g])));if(LINEUP_MEMO[key])return LINEUP_MEMO[key];
  const T=TEAMS.all,days=["tue","wed","thu"],L={},tot={},dayCnt={},opts={};
  const pool=[...new Set(days.flatMap(d=>T.agentsFor(d).filter(n=>own(n)===g)))];
  const elig=(n,d,si)=>T.agentsFor(d).includes(n)&&!T.busy(d,n,si);
  pool.forEach(n=>{tot[n]=0;dayCnt[n]={tue:0,wed:0,thu:0};opts[n]=0;days.forEach(d=>[0,1,2].forEach(si=>{if(elig(n,d,si))opts[n]++;}));});
  days.forEach(d=>L[d]=[[],[],[]]);
  const cands=(d,si)=>pool.filter(n=>elig(n,d,si)&&!L[d][si].includes(n));
  const better=d=>(a,b)=>dayCnt[a][d]-dayCnt[b][d]||tot[a]-tot[b]||(T.known(d,b)-T.known(d,a))||opts[a]-opts[b]||pool.indexOf(a)-pool.indexOf(b);
  const short={};
  // Phase 1, day by day: get as many different agents in as possible (each agent once that day), using a maximum matching.
  //   Agents with fewer pull-outs so far get first claim.
  for(const d of days){
    const slots=[];[0,1,2].forEach(si=>{for(let k=0;k<capOf(d,si,g);k++)slots.push(si);});
    const owner=new Array(slots.length).fill(null);
    const order=pool.filter(n=>[0,1,2].some(si=>elig(n,d,si))).sort((a,b)=>tot[a]-tot[b]||opts[a]-opts[b]||(T.known(d,b)-T.known(d,a))||pool.indexOf(a)-pool.indexOf(b));
    const tryAssign=(n,seen)=>{for(let x=0;x<slots.length;x++){if(seen.has(x)||!elig(n,d,slots[x]))continue;seen.add(x);
      if(owner[x]===null||tryAssign(owner[x],seen)){owner[x]=n;return true;}}return false;};
    for(const n of order)tryAssign(n,new Set());
    owner.forEach((n,x)=>{if(n){L[d][slots[x]].push(n);tot[n]++;dayCnt[n][d]++;}});
  }
  // Phase 2: any spots still open go to free agents with the fewest pull-outs (a second session that day)
  for(const d of days)for(const si of [0,1,2]){
    while(L[d][si].length<capOf(d,si,g)){
      const c=cands(d,si).sort(better(d));
      if(!c.length){short[d+si]=capOf(d,si,g)-L[d][si].length;break;}
      const n=c[0];L[d][si].push(n);tot[n]++;dayCnt[n][d]++;
    }
  }
  // Even out totals without taking anyone out of a day they are already in
  for(let guard=0;guard<500;guard++){
    let moved=false;
    const byTot=[...pool].filter(n=>opts[n]>0).sort((a,b)=>tot[a]-tot[b]);
    outer: for(const lo of byTot)for(const hi of [...byTot].reverse()){
      if(tot[hi]-tot[lo]<2)break;
      const spots=[];days.forEach(d=>[0,1,2].forEach(si=>{const k=L[d][si].indexOf(hi);if(k>=0&&dayCnt[hi][d]>=2&&elig(lo,d,si)&&!L[d][si].includes(lo))spots.push({d,si,k});}));
      if(!spots.length)continue;
      spots.sort((a,b)=>dayCnt[lo][a.d]-dayCnt[lo][b.d]);
      const {d,si,k}=spots[0];L[d][si][k]=lo;tot[hi]--;dayCnt[hi][d]--;tot[lo]++;dayCnt[lo][d]++;moved=true;break outer;
    }
    if(!moved)break;
  }
  return LINEUP_MEMO[key]={L,short,tot,opts};
}

// Who can attend at least one session on a day but isn't in the lineup that day
function missingOn(d){const T=TEAMS.all,S=st.all,out=new Set(S.off[d]);
  const {sessions}=plan("all",d);const inIt=new Set(sessions.flat().map(x=>x.name).filter(Boolean));
  return T.agentsFor(d).filter(n=>!out.has(n)&&!inIt.has(n)&&[0,1,2].some(si=>!T.busy(d,n,si)&&!S.offS[d][si].includes(n)));}
// Set each session's numbers so every agent who can attend gets one pull-out each day, spread as evenly as possible
function fitEveryone(){
  const T=TEAMS.all;
  for(const d of ["tue","wed","thu"])for(const g of ["pp","iv"]){
    const out=new Set(st.all.off[d]);
    const ag=T.agentsFor(d).filter(n=>own(n)===g&&!out.has(n));
    const free=n=>[0,1,2].filter(si=>!T.busy(d,n,si));
    const cnt=[0,0,0];
    ag.filter(n=>free(n).length).sort((a,b)=>free(a).length-free(b).length).forEach(n=>{const f=free(n).sort((x,y)=>cnt[x]-cnt[y]||x-y);cnt[f[0]]++;});
    cnt.forEach((c,si)=>capS[d][si][g]=c);
  }
  saveCap();
}
// Agents who missed a day (and haven't attended since) are carried into the next day
const DAY_ORDER=["tue","wed","thu"];
function attendedOn(tk,d){return new Set(plan(tk,d).sessions.flat().map(x=>x.name).filter(Boolean));}
function carriedInto(tk,d){
  const i=DAY_ORDER.indexOf(d);if(i<=0)return new Set();
  const prev=DAY_ORDER[i-1],went=attendedOn(tk,prev),before=carriedInto(tk,prev);
  const pool=TEAMS[tk].agents?TEAMS[tk].agents:[...new Set(DAY_ORDER.flatMap(x=>TEAMS[tk].agentsFor(x)))];
  const miss=new Set();
  pool.forEach(n=>{const B=buildLineup(own(n));if(!(B.opts[n]>0))return; if(!went.has(n))miss.add(n);});
  before.forEach(n=>{if(!went.has(n))miss.add(n);});
  return miss;
}
function plan(tk,d){
  const T=TEAMS[tk],S=st[tk],out=new Set(S.off[d]),A=T.agentsFor(d);
  const offIn=(n,i)=>out.has(n)||S.offS[d][i].includes(n)||!!T.busy(d,n,i);
  const rank=(cnt)=>(a,b)=>cnt[a]-cnt[b]||(T.known(d,b)-T.known(d,a))||A.indexOf(a)-A.indexOf(b);
  // 1. Default lineup: the balanced three-day lineup
  const sessions=[[],[],[]],used={};A.forEach(a=>used[a]=0);
  for(const g of ["pp","iv"]){
    let B=buildLineup(g),Ld=B.L[d];
    if(GROUP_MOVE[d]){LEGACY=true;let old;try{old=buildLineup(g).L[d];}finally{LEGACY=false;}
      // keep each moved agent unless they'd be on break, lunch etc. at the new time; those spots are refilled below
      Ld=GROUP_MOVE[d].map(from=>old[from]);
      for(let si=0;si<3;si++){const keep=Ld[si].filter(n=>!T.busy(d,n,si));
        keep.forEach(n=>{sessions[si].push({name:n,g});used[n]++;});
        Ld[si].filter(n=>T.busy(d,n,si)).forEach(n=>sessions[si].push({name:null,g,conflict:n}));
        for(let k=Ld[si].length;k<capOf(d,si,g);k++)sessions[si].push({name:null,g});
        // a session with fewer spots than the moved group keeps the first ones
        const mine=sessions[si].filter(x=>x.g===g);if(mine.length>capOf(d,si,g)){const drop=new Set(mine.slice(capOf(d,si,g)));sessions[si]=sessions[si].filter(x=>!drop.has(x));}}
      continue;}
    for(let si=0;si<3;si++){Ld[si].forEach(n=>{sessions[si].push({name:n,g});used[n]++;});
      for(let k=Ld[si].length;k<capOf(d,si,g);k++)sessions[si].push({name:null,g,short:true});}
  }
  // 2. Take out anyone marked unavailable
  sessions.forEach((s,si)=>s.forEach((x,k)=>{if(x.name&&(out.has(x.name)||S.offS[d][si].includes(x.name)))s[k]={name:null,g:x.g,replaces:x.name};}));
  // 3. Removed from one session: add them to the next session that day where they are free.
  //    Prefer swapping with a same-department agent who is free in the earlier session; otherwise take the spot of the agent there with the most sessions overall.
  for(let i=0;i<3;i++)sessions[i].forEach((slot,k)=>{
    if(slot.name||!slot.replaces||out.has(slot.replaces))return;const X=slot.replaces;
    if(sessions.slice(i+1).some(s=>s.some(y=>y.name===X)))return; // already in a later session
    for(let j=i+1;j<3;j++){
      if(offIn(X,j))continue;
      const here=sessions[j].map((y,m)=>({y,m})).filter(({y})=>y.name&&y.g===slot.g&&!y.movedFrom);
      if(!here.length)continue;
      const swap=here.find(({y})=>!offIn(y.name,i)&&!sessions[i].some(z=>z.name===y.name));
      if(swap){sessions[i][k]={name:swap.y.name,g:slot.g,movedFrom:j+1};sessions[j][swap.m]={name:X,g:slot.g,movedFrom:i+1};break;}
      const tot=buildLineup(slot.g).tot;
      here.sort((a,b)=>(tot[b.y.name]||0)-(tot[a.y.name]||0));
      sessions[j][here[0].m]={name:X,g:slot.g,movedFrom:i+1};
      break;
    }
  });
  // Pull-outs each agent already had on earlier days: those who already joined go last
  const prev={};{const i=DAY_ORDER.indexOf(d);DAY_ORDER.slice(0,Math.max(0,i)).forEach(pd=>attendedOn(tk,pd).forEach(n=>prev[n]=(prev[n]||0)+1));}
  const pv=n=>prev[n]||0;
  const displaced=new Set(sessions.flat().filter(x=>x.conflict&&!out.has(x.conflict)).map(x=>x.conflict));
  // 4. Fill remaining gaps with a free agent from the same team
  const count={};A.forEach(a=>count[a]=0);
  sessions.forEach(s=>s.forEach(x=>{if(x.name)count[x.name]++;}));
  for(let si=0;si<3;si++)for(const slot of sessions[si]){
    if(slot.name||slot.short)continue;
    const taken=new Set(sessions[si].map(x=>x.name).filter(Boolean));
    const c=A.filter(n=>own(n)===slot.g&&!taken.has(n)&&!offIn(n,si)).sort((a,b)=>(displaced.has(b)-displaced.has(a))||(count[a]>0)-(count[b]>0)||pv(a)-pv(b)||rank(count)(a,b));
    if(c.length){slot.name=c[0];count[c[0]]++;slot.isRep=true;}
  }
  // 5. Priority: agents who missed an earlier day (off, on leave, removed, or no room) go first on the next day they can attend.
  //    They take the spot of a same-department agent who did attend the earlier days, starting with whoever has the most pull-outs.
  const carry=carriedInto(tk,d);
  if(carry.size){
    const tot=g=>buildLineup(g).tot;
    [...carry].sort((a,b)=>(tot(own(a))[a]||0)-(tot(own(b))[b]||0)).forEach(X=>{
      if(!A.includes(X)||out.has(X)||sessions.some(s=>s.some(y=>y.name===X)))return;
      const g=own(X);let best=null;
      for(let si=0;si<3;si++){
        if(offIn(X,si))continue;
        sessions[si].forEach((y,m)=>{
          if(y.g!==g)return;
          const score=!y.name?1e9:(carry.has(y.name)||y.priority||y.movedFrom)?-1:pv(y.name)*1000+(tot(g)[y.name]||0);
          if(score>=0&&(!best||score>best.score))best={si,m,score};
        });
      }
      if(best){const y=sessions[best.si][best.m];sessions[best.si][best.m]={name:X,g,priority:true};
        if(y.name){count[y.name]--;}count[X]=(count[X]||0)+1;}
    });
  }
  // 6. If someone who hasn't joined on any earlier day is left out today, they take the spot of an agent who already joined before
  if(DAY_ORDER.indexOf(d)>0){
    const inToday=()=>new Set(sessions.flat().map(x=>x.name).filter(Boolean));
    A.filter(n=>!out.has(n)&&pv(n)===0&&!inToday().has(n)).sort((a,b)=>A.indexOf(a)-A.indexOf(b)).forEach(X=>{
      if(inToday().has(X))return;let best=null;
      for(let si=0;si<3;si++){if(offIn(X,si))continue;
        sessions[si].forEach((y,m)=>{if(y.g!==own(X)||!y.name||y.priority||y.movedFrom||pv(y.name)===0)return;
          const sc=pv(y.name)*1000+(count[y.name]||0);if(!best||sc>best.sc)best={si,m,sc};});}
      if(best){const y=sessions[best.si][best.m];count[y.name]--;sessions[best.si][best.m]={name:X,g:own(X),priority:true};count[X]=(count[X]||0)+1;}
    });
  }
  sessions.forEach(s=>s.sort((a,b)=>(a.g===b.g?0:a.g==="pp"?-1:1)));
  return {sessions,count};
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){

  for(const g of ["pp","iv"]){const o=$("cap-"+g),sm=same(g);o.textContent=sm?cap[g]:"Mixed";o.classList.toggle("mixed",!sm);o.title=sm?"":"Sessions have different numbers. Use + or − to set them all the same.";}

    return `<li class="${isOff?"off":""}"><label for="av-${i}"><span class="nm">${esc(n)}</span><span class="sh">${T.chip(day,n).label}${own(n)==="pp"?" PH":" ET"} · ${(()=>{const t=buildLineup(own(n)).tot[n]||0;return t?`${t} pull-out${t>1?"s":""} Oct 27–29`:"no session fits their breaks"})()}</span></label><input class="sw" type="checkbox" id="av-${i}" data-name="${esc(n)}" ${isOff?"":"checked"} ${MODE==="pending"?"disabled":""} aria-label="${esc(n)} working on ${D.label}"></li>`}).join("");
  $("agentsCount").textContent=S.off[day].length||"";

  // Sessions

  const miss=missingOn(day);

  $("status").innerHTML=missTxt+fairTxt+" · "+(open?`<span class="bad">${open} open spot${open>1?"s":""}</span> · no free agent from that department`:`<span class="ok">All ${flat.length} spots filled</span>`);
  $("sessionList").innerHTML=sessions.map((s,si)=>{
    const group=g=>{const rows=s.filter(x=>x.g===g);if(!rows.length)return "";
      return `<div class="grp"><div class="grp-l">${GROUPS[g]}</div>${rows.map(x=>{
        if(!x.name)return `<div class="row open">Open · no one free</div>`;

    const rm=S.offS[day][si];
    return `<article class="card"><div class="card-h"><div><div class="t-row"><label class="t-edit" title="Change this session's time"><span class="t">${sess(day,si).et} ET</span><span class="caret-d" aria-hidden="true"></span><select class="t-sel" aria-label="Session ${si+1} time" data-time="${si}" ${MODE==="pending"?"disabled":""}>${(()=>{const cur=sess(day,si),cs=cur.start!=null?cur.start:startOf(cur);return TIME_OPTIONS.map(m=>`<option value="${m}"${m===cs?" selected":""}>${range12(m)} ET</option>`).join("");})()}</select></label><button class="cam" data-snap="${si}" aria-label="Copy a picture of this session's names" title="Copy names as a picture"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button></div></div>
      <div class="mini" role="group" aria-label="Pull-outs for this session">${["pp","iv"].map(g=>`<span class="mini-s"><span class="mini-l">${g==="pp"?"PP":"GOL"}</span><button data-cap="${g}" data-si="${si}" data-dir="-1" aria-label="Fewer ${GROUPS[g]} in this session">−</button><output>${capOf(day,si,g)}</output><button data-cap="${g}" data-si="${si}" data-dir="1" aria-label="More ${GROUPS[g]} in this session">+</button></span>`).join("")}</div></div>${group("pp")}${group("iv")}
      ${rm.length?`<div class="removed">${rm.map(n=>`<span><s>${esc(n)}</s> <button data-undo-session="${si}" data-name="${esc(n)}" aria-label="Put ${esc(n)} back in this session">Undo</button></span>`).join("")}</div>`:""}</article>`;}).join("");
}

// Camera: draw the session's names (only) to a picture and copy it
function snapCanvas(si){
  const {sessions}=plan("all",day),s=sessions[si],D=DAYS[day];
  const groups=[["pp",GROUPS.pp],["iv",GROUPS.iv]].map(([g,l])=>[l,s.filter(x=>x.g===g&&x.name).map(x=>x.name)]).filter(([,n])=>n.length);
  const W=560,P=28,lh=30,F="Archivo, system-ui, sans-serif";
  let H=P+26+22+14;groups.forEach(([,n])=>{H+=26+n.length*lh+12;});H+=P-12;
  const sc=2,c=document.createElement("canvas");c.width=W*sc;c.height=H*sc;const x=c.getContext("2d");x.scale(sc,sc);
  x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
  x.fillStyle="#e1f3e7";x.fillRect(0,0,W,P+26+22+6);
  let y=P+20;x.fillStyle="#18212c";x.font=`700 22px ${F}`;x.fillText(`${sess(day,si).et} ET`,P,y);
  y+=24;x.fillStyle="#4d5a6b";x.font=`500 14px ${F}`;x.fillText(`${D.label}, ${D.date}`,P,y);
  y+=20;
  groups.forEach(([label,names])=>{
    y+=26;x.fillStyle="#7a8696";x.font=`600 12px ${F}`;x.fillText(label.toUpperCase(),P,y);
    names.forEach(n=>{y+=lh;x.fillStyle="#18212c";x.font=`500 17px ${F}`;x.fillText(n,P,y);});
    y+=12;
  });
  return c;
}
async function snap(si){
  try{await document.fonts.ready;}catch(e){}
  const c=snapCanvas(si),url=c.toDataURL("image/png");
  const blob=new Promise(res=>c.toBlob(res,"image/png"));
  let ok=false;
  try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);ok=true;}}catch(e){ok=false;}
  if(ok){toast("Picture copied. Paste it anywhere.");return;}
  $("snapImg").src=url;$("snapMsg").textContent=`${DAYS[day].label} · ${sess(day,si).et} ET`;$("snapModal").hidden=false;
}

$("resetDay").onclick=()=>{st[team].off[day]=[];st[team].offS[day]=[[],[],[]];save();render();toast(`${DAYS[day].label} reset`);};
$("resetAll").onclick=()=>{st[team]=blank()[team];save();render();toast("All days reset");};
function scheduleText(){const T=TEAMS.all;return T.days.map(d=>{const {sessions}=plan("all",d);return `${DAYS[d].label}, ${DAYS[d].date}\n`+sessions.map((s,si)=>`${sess(d,si).et} ET (${sess(d,si).ph} PH)\n  Puritan's Pride: `+(s.filter(x=>x.g==="pp").map(x=>x.name||"OPEN").join(", ")||"none")+`\n  GOL: `+(s.filter(x=>x.g==="iv").map(x=>x.name||"OPEN").join(", ")||"none")).join("\n")}).join("\n\n");}
$("copyBtn").onclick=async()=>{const txt=scheduleText();
  try{await navigator.clipboard.writeText(txt);toast("Schedule copied");}
  catch(err){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Schedule copied");}catch(e2){toast("Copy blocked. Select the text manually.");}ta.remove();}};
let tt;function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800);}
/* ---------- shared saving: the page republishes itself with the lineup inside it ---------- */
var MODE=window.claude?"pending":"local"; // pending → writer | ro ; local = outside Claude (this browser only)
let ART=null,shareTimer=null,lastSaved=SHARED&&SHARED.savedAt?new Date(SHARED.savedAt):null;
const RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
const fmtTime=d=>d?d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
function setSync(cls,txt){const el=document.getElementById("syncStatus");if(!el)return;el.className="sync "+cls;el.textContent=txt;}
// Viewers who can't save for everyone can still use every control; their changes stay on their own device
const MINE=KEY+"-mine";
function saveMine(){if(MODE!=="ro")return;try{localStorage.setItem(MINE,JSON.stringify({base:SHARED&&SHARED.savedAt||null,st,capS,cap}));}catch(e){}hasMine=true;showMode();}
var hasMine=false;
function loadMine(){try{const m=JSON.parse(localStorage.getItem(MINE)||"null");if(!m)return;
  if(m.base!==(SHARED&&SHARED.savedAt||null)){localStorage.removeItem(MINE);if(SHARED)toast("The shared lineup was updated, so your own changes were cleared.");return;}
  st=m.st;capS=m.capS;cap=m.cap;hasMine=true;}catch(e){}}
function resetMine(){try{localStorage.removeItem(MINE);}catch(e){}
  if(SHARED&&SHARED.st){st=JSON.parse(JSON.stringify(SHARED.st));capS=JSON.parse(JSON.stringify(SHARED.capS));if(SHARED.cap)cap={...SHARED.cap};}
  else{st=blank();fitEveryone();}
  hasMine=false;showMode();render();toast("Showing the shared lineup again");}
document.addEventListener("click",e=>{if(e.target.id==="resetMine")resetMine();});
function showMode(){
  document.documentElement.classList.toggle("pending",MODE==="pending");
  if(MODE==="writer")setSync("ok",lastSaved?`Shared · saved ${fmtTime(lastSaved)}`:"Shared with everyone");
  else if(MODE==="ro"){const el=document.getElementById("syncStatus");if(el){el.className="sync"+(hasMine?" busy":"");
      el.innerHTML=hasMine?`Your changes are only on this device <button class="reset" id="resetMine">Show shared lineup</button>`:(lastSaved?`Shared lineup · updated ${fmtTime(lastSaved)}`:"Shared lineup");}}
  else if(MODE==="pending")setSync("","Loading…");
  else setSync("","");
}
function buildDoc(state){
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  const css=document.getElementById("app-css").textContent;
  const tpl=document.getElementById("app-tpl").innerHTML;
  const js=document.getElementById("app-js").textContent;
  const S="script";
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body><title>Puritan's Pride Pull-Out Roster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-css">${css}</style>
<template id="app-tpl">${tpl}</template>
<${S} type="application/json" id="shared-state">${json}</${S}>
<${S} id="app-js">${js}</${S}>
</body></html>`;
}
function queueShare(){
  if(MODE!=="writer")return;
  clearTimeout(shareTimer);setSync("busy","Saving…");
  shareTimer=setTimeout(()=>{if(!document.getElementById("agentsModal").hidden){queueShare();return;}publishShared();},2500);
}
async function publishShared(){
  if(MODE!=="writer"||!ART)return;
  try{sessionStorage.setItem(KEY+"-ui",JSON.stringify({day,dept,details}));}catch(e){}
  const state={v:1,st,capS,cap,savedAt:new Date().toISOString()};
  try{await ART.publish(buildDoc(state));lastSaved=new Date(state.savedAt);showMode();}
  catch(e){const c=e&&e.code;
    if(c==="conflict"){setSync("busy","Someone else saved. Loading their version…");}
    else if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(c)){MODE="ro";saveMine();showMode();render();toast("Your change is saved on this device only.");}
    else if(c==="rate_limited"){setSync("busy","Saving…");shareTimer=setTimeout(publishShared,8000);}
    else{setSync("err","Couldn't save. Make another change to retry.");}}
}
(async()=>{
  if(MODE==="local"){showMode();return;}
  showMode();
  try{
    const [a,u]=await Promise.all([window.claude.use("artifact"),window.claude.use("user")]);
    ART=a;const can=a&&u?await u.canEdit().catch(()=>false):false;
    MODE=can?"writer":"ro";
  }catch(e){MODE="ro";}
  if(MODE==="ro")loadMine();
  showMode();render();
})();
try{const ui=JSON.parse(sessionStorage.getItem(KEY+"-ui")||"null");if(ui){sessionStorage.removeItem(KEY+"-ui");if(DAYS[ui.day])day=ui.day;if(ui.dept)dept=ui.dept;if(typeof ui.details==="boolean")details=ui.details;}}catch(e){}

/* ---------- cloud sync (Supabase): everyone with the link shares one lineup ---------- */
var CLOUD=null,CLOUD_READY=false,cloudTimer=null,cloudSaved=null;
const CLIENT=Math.random().toString(36).slice(2);
const SB_URL="https://dfjwbzrtimsblttfxgcr.supabase.co",SB_KEY="sb_publishable_UO9liPtNMJ8uJPmybreG_A_hjWWE3QZ";
function cloudStatus(cls,txt){setSync(cls,txt);}
function applyRemote(data){
  if(!data||!data.st||!data.st.all||!data.capS)return;
  st=data.st;capS=data.capS;if(data.cap)cap=data.cap;
  cloudSaved=data.savedAt?new Date(data.savedAt):null;
  try{localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(KEY+"-capS2",JSON.stringify(capS));localStorage.setItem(KEY+"-cap",JSON.stringify(cap));}catch(e){}
  render();cloudStatus("ok",cloudSaved?`Synced · saved ${fmtTime(cloudSaved)}`:"Synced");
}
function cloudQueue(){
  if(!CLOUD||!CLOUD_READY)return;
  clearTimeout(cloudTimer);cloudStatus("busy","Saving…");
  cloudTimer=setTimeout(cloudPush,700);
}
async function cloudPush(){
  cloudTimer=null;
  const data={st,capS,cap,savedAt:new Date().toISOString(),by:CLIENT};
  const {error}=await CLOUD.from("pullout_roster").upsert({id:"main",data,updated_at:data.savedAt});
  if(error){cloudStatus("err","Couldn't save online. Changes are kept on this device.");return;}
  cloudSaved=new Date(data.savedAt);cloudStatus("ok",`Synced · saved ${fmtTime(cloudSaved)}`);
}
async function cloudPull(){
  const {data,error}=await CLOUD.from("pullout_roster").select("data").eq("id","main").maybeSingle();
  if(error)throw error;
  if(data&&data.data)applyRemote(data.data);else cloudStatus("ok","Synced");
}
(async()=>{
  if(!window.supabase||!window.supabase.createClient){cloudStatus("err","Offline · changes saved on this device only");return;}
  try{
    CLOUD=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
    cloudStatus("busy","Connecting…");
    await cloudPull();CLOUD_READY=true;
    CLOUD.channel("roster").on("postgres_changes",{event:"*",schema:"public",table:"pullout_roster"},p=>{
      const d=p.new&&p.new.data;if(!d||d.by===CLIENT)return;
      if(cloudTimer){clearTimeout(cloudTimer);cloudTimer=null;}
      applyRemote(d);toast("Lineup updated by a colleague");
    }).subscribe();
    // backup refresh in case the live connection drops
    setInterval(()=>{if(!cloudTimer)cloudPull().catch(()=>{});},30000);
  }catch(e){CLOUD=null;cloudStatus("err","Offline · changes saved on this device only");}
})();
showMode();
render();
</script>
